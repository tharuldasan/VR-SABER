<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Saber Bridge - Ultra Smooth Mirror Edition</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #111; 
            color: #00ffff; font-family: 'Courier New', Courier, monospace; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
        }
        #ui-container {
            background: rgba(0, 20, 20, 0.8); padding: 20px; border: 1px solid #00ffff; border-radius: 10px;
            text-align: center; z-index: 10; max-width: 400px; width: 90%;
        }
        button {
            background: rgba(0, 255, 255, 0.1); color: #00ffff; border: 1px solid #00ffff;
            padding: 12px 24px; margin: 10px; cursor: pointer; font-size: 16px; font-weight: bold;
            text-transform: uppercase; transition: 0.2s;
        }
        button:hover { background: #00ffff; color: #000; }
        input {
            background: #000; color: #00ffff; border: 1px solid #00ffff;
            padding: 15px; margin: 10px 0; width: 60%; text-align: center; font-size: 24px; font-weight: bold;
            letter-spacing: 5px;
        }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
        #debug-overlay { 
            position: absolute; top: 10px; left: 10px; color: #00ff00; 
            font-size: 14px; z-index: 20; pointer-events: none; display: none;
            background: rgba(0,0,0,0.5); padding: 10px;
        }
        .hidden { display: none !important; }
    </style>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <h1>SABER SMOOTH BRIDGE</h1>
        <div id="step-1">
            <p>Select your device role:</p>
            <button onclick="startPCMode()">I am the Screen (PC)</button><br>
            <button onclick="startPhoneMode()">I am the Saber (Phone)</button>
        </div>

        <div id="pc-ui" class="hidden">
            <p>Connecting to Cloud Server...</p>
            <div id="pc-ready" class="hidden">
                <p>Enter this PIN on your phone:</p>
                <h1 id="pc-id" style="color: #fff; background: #222; padding: 20px; font-size: 48px; margin: 10px 0;">----</h1>
            </div>
        </div>

        <div id="phone-ui" class="hidden">
            <p>Enter the 4-digit PIN from your PC:</p>
            <input type="number" id="target-id" placeholder="1234">
            <button id="connect-btn" onclick="connectToPC()">Connect</button>
            <p id="phone-status" style="font-size: 14px; color: #ffeb3b; margin-top: 20px; white-space: pre-wrap;"></p>
        </div>
    </div>

    <div id="game-container"></div>
    <div id="debug-overlay">Interpolating server packets...</div>

    <script>
        let client;
        let currentTopic = "";
        
        // Target variables used to interpolate and smooth out lagging network packets
        let targetX = 0, targetY = 0, targetZ = 0;

        // --- 1. PC (SCREEN) LOGIC ---
        function startPCMode() {
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('pc-ui').classList.remove('hidden');
            
            const pin = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('pc-id').innerText = pin;
            currentTopic = "vrsaber/room/" + pin;

            client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

            client.on('connect', function () {
                document.getElementById('pc-ui').firstElementChild.innerText = "Cloud Connection Established!";
                document.getElementById('pc-ready').classList.remove('hidden');
                client.subscribe(currentTopic);
            });

            client.on('message', function (topic, message) {
                if (topic === currentTopic) {
                    if (document.getElementById('game-container').style.display !== 'block') {
                        document.getElementById('ui-container').classList.add('hidden');
                        document.getElementById('game-container').style.display = 'block';
                        document.getElementById('debug-overlay').style.display = 'block';
                        init3DScene();
                    }

                    try {
                        const data = JSON.parse(message.toString());
                        
                        // MIRROR FIX: Inverted the mathematical signs (+/-) on the geometric mappings 
                        // so left matches left and right matches right relative to the monitor perspective.
                        targetX = THREE.MathUtils.degToRad(data.beta);   // Pitch
                        targetZ = THREE.MathUtils.degToRad(data.gamma);  // Mirrored Roll
                        targetY = THREE.MathUtils.degToRad(-data.alpha); // Mirrored Yaw
                        
                        document.getElementById('debug-overlay').innerText = `Smooth Cache Syncing...\nTarget Pitch: ${Math.round(data.beta)}°\nTarget Roll: ${Math.round(data.gamma)}°`;
                    } catch(e) { console.error("Data parse error", e); }
                }
            });
        }

        // --- 2. PHONE (SABER) LOGIC ---
        function startPhoneMode() {
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('phone-ui').classList.remove('hidden');
        }

        function connectToPC() {
            const enteredPin = document.getElementById('target-id').value.trim();
            if (enteredPin.length !== 4) {
                alert("Please enter a valid 4-digit PIN.");
                return;
            }

            const statusText = document.getElementById('phone-status');
            statusText.innerText = "Initializing connection parameters...";

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            initiateCloudConnection(enteredPin, statusText);
                        } else {
                            statusText.innerText = "Permission Denied: Cannot access gyro.";
                        }
                    })
                    .catch(err => { statusText.innerText = "Sensor Error: " + err; });
            } else {
                initiateCloudConnection(enteredPin, statusText);
            }
        }

        function initiateCloudConnection(pin, statusText) {
            statusText.innerText = "Reaching out to cloud server...";
            currentTopic = "vrsaber/room/" + pin;

            client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

            client.on('connect', function () {
                statusText.innerText = "Connected! Saber Mirror Active.\nSwing your phone smoothly.";
                document.getElementById('connect-btn').classList.add('hidden');
                document.getElementById('target-id').classList.add('hidden');
                
                startSendingMotionData(statusText);
            });

            client.on('error', function (err) {
                statusText.innerText = "Could not establish server pipeline: " + err;
            });
        }

        let lastSent = 0;
        const sendInterval = 16; // Upgraded transmission rate to 60hz (16ms) for extreme precision

        function startSendingMotionData(statusText) {
            window.addEventListener('deviceorientation', (event) => {
                const now = Date.now();
                if (now - lastSent < sendInterval) return; 
                lastSent = now;

                if (client && client.connected) {
                    const payload = JSON.stringify({
                        alpha: event.alpha || 0,
                        beta: event.beta || 0,
                        gamma: event.gamma || 0
                    });
                    client.publish(currentTopic, payload, { qos: 0 }); // QoS 0 avoids network overhead/delivery lag
                    statusText.innerText = `Streaming Matrix...\n\nPitch: ${Math.round(event.beta || 0)}°\nRoll: ${Math.round(event.gamma || 0)}°`;
                }
            });
        }

        // --- 3. 3D SCENE LOGIC (PC ONLY) ---
        let scene, camera, renderer, saber;

        function init3DScene() {
            const container = document.getElementById('game-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.5, 4);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const light = new THREE.AmbientLight(0x404040); 
            scene.add(light);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(0, 1, 1);
            scene.add(directionalLight);

            const saberGroup = new THREE.Group();
            
            const handleGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.5, 16);
            const handleMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.position.y = 0.25; 
            
            const bladeGeo = new THREE.CylinderGeometry(0.05, 0.05, 2.5, 16);
            const bladeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const blade = new THREE.Mesh(bladeGeo, bladeMat);
            blade.position.y = 1.75; 

            saberGroup.add(handle);
            saberGroup.add(blade);
            saberGroup.position.set(0, 0.5, 1.5); 
            scene.add(saberGroup);
            saber = saberGroup; 

            const gridHelper = new THREE.GridHelper(20, 20, 0x00ffff, 0x444444);
            scene.add(gridHelper);

            // --- ULTRA SMOOTH ANIMATION LOOP ---
            function animate() {
                requestAnimationFrame(animate);

                if (saber) {
                    // LINEAR INTERPOLATION (LERP):
                    // Instead of snapping instantly to target positions, we move 15% closer 
                    // to the target rotation values on every single frame. This eliminates all latency stutter.
                    saber.rotation.x += (targetX - saber.rotation.x) * 0.15;
                    saber.rotation.y += (targetY - saber.rotation.y) * 0.15;
                    saber.rotation.z += (targetZ - saber.rotation.z) * 0.15;
                }

                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
