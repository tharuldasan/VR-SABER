<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Saber Bridge</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #111; 
            color: #00ffff; font-family: 'Courier New', Courier, monospace; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
        }
        #ui-container {
            background: rgba(0, 20, 20, 0.8); padding: 20px; border: 1px solid #00ffff; border-radius: 10px;
            text-align: center; z-index: 10; max-width: 400px; width: 90%;
        }
        button {
            background: transparent; color: #00ffff; border: 1px solid #00ffff;
            padding: 10px 20px; margin: 10px; cursor: pointer; font-size: 16px; font-weight: bold;
            text-transform: uppercase; transition: 0.2s;
        }
        button:hover { background: #00ffff; color: #000; }
        input {
            background: #000; color: #00ffff; border: 1px solid #00ffff;
            padding: 10px; margin: 10px 0; width: 80%; text-align: center; font-size: 16px;
        }
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
        .hidden { display: none !important; }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <h1>SABER BRIDGE</h1>
        <div id="step-1">
            <p>Select your device role:</p>
            <button onclick="startPCMode()">I am the Screen (PC)</button>
            <button onclick="startPhoneMode()">I am the Saber (Phone)</button>
        </div>

        <div id="pc-ui" class="hidden">
            <p>Waiting for connection...</p>
            <p>Enter this ID on your phone:</p>
            <h2 id="pc-id" style="color: #fff; background: #222; padding: 10px;">GENERATING...</h2>
        </div>

        <div id="phone-ui" class="hidden">
            <p>Enter the ID shown on your PC:</p>
            <input type="text" id="target-id" placeholder="e.g. 1a2b-3c4d">
            <button id="connect-btn" onclick="connectToPC()">Connect & Calibrate</button>
            <p id="phone-status"></p>
        </div>
    </div>

    <div id="game-container"></div>

    <script>
        let peer;
        let conn;

        // --- 1. PC (SCREEN) LOGIC ---
        function startPCMode() {
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('pc-ui').classList.remove('hidden');
            
            // Initialize PeerJS
            peer = new Peer(); 
            peer.on('open', function(id) {
                document.getElementById('pc-id').innerText = id;
            });

            peer.on('connection', function(connection) {
                conn = connection;
                document.getElementById('ui-container').classList.add('hidden');
                document.getElementById('game-container').style.display = 'block';
                init3DScene();

                // Listen for orientation data from phone
                conn.on('data', function(data) {
                    if(data.type === 'rotation' && saber) {
                        // Apply rotation to saber. 
                        // Note: Gyro mappings require tweaking depending on how you hold the phone.
                        saber.rotation.x = THREE.MathUtils.degToRad(data.beta); // Pitch
                        saber.rotation.z = THREE.MathUtils.degToRad(-data.gamma); // Roll
                        saber.rotation.y = THREE.MathUtils.degToRad(data.alpha); // Yaw
                    }
                });
            });
        }

        // --- 2. PHONE (SABER) LOGIC ---
        function startPhoneMode() {
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('phone-ui').classList.remove('hidden');
            peer = new Peer();
        }

        function connectToPC() {
            const targetId = document.getElementById('target-id').value.trim();
            if (!targetId) return;

            document.getElementById('phone-status').innerText = "Connecting...";
            conn = peer.connect(targetId);

            conn.on('open', function() {
                document.getElementById('phone-status').innerText = "Connected! Swing your phone.";
                document.getElementById('connect-btn').classList.add('hidden');
                
                // Request sensor permissions (Required for iOS 13+)
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(permissionState => {
                            if (permissionState === 'granted') {
                                startSendingMotionData();
                            } else {
                                document.getElementById('phone-status').innerText = "Permission denied.";
                            }
                        })
                        .catch(console.error);
                } else {
                    // Non-iOS devices usually don't need explicit permission prompt
                    startSendingMotionData();
                }
            });
        }

        function startSendingMotionData() {
            window.addEventListener('deviceorientation', (event) => {
                if (conn && conn.open) {
                    // Send orientation data to PC
                    conn.send({
                        type: 'rotation',
                        alpha: event.alpha, // Compass direction
                        beta: event.beta,   // Front-to-back tilt
                        gamma: event.gamma  // Left-to-right tilt
                    });
                }
            });
        }

        // --- 3. 3D SCENE LOGIC (PC ONLY) ---
        let scene, camera, renderer, saber;

        function init3DScene() {
            const container = document.getElementById('game-container');
            
            scene = new THREE.Scene();
            
            // Camera setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.5, 4); // Position camera roughly at head height

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Lighting
            const light = new THREE.AmbientLight(0x404040); // Soft white light
            scene.add(light);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(0, 1, 1);
            scene.add(directionalLight);

            // Create the Saber
            // We use a Group to offset the pivot point so it swings from the handle, not the center
            const saberGroup = new THREE.Group();
            
            const handleGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.5, 16);
            const handleMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.position.y = 0.25; // Offset
            
            const bladeGeo = new THREE.CylinderGeometry(0.05, 0.05, 2.5, 16);
            const bladeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const blade = new THREE.Mesh(bladeGeo, bladeMat);
            blade.position.y = 1.75; // Offset above handle

            // Glow effect (simple outer cylinder)
            const glowGeo = new THREE.CylinderGeometry(0.1, 0.1, 2.5, 16);
            const glowMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.3 });
            const glow = new THREE.Mesh(glowGeo, glowMat);
            glow.position.y = 1.75;

            saberGroup.add(handle);
            saberGroup.add(blade);
            saberGroup.add(glow);

            // Position the saber in front of the camera, slightly down (like holding it in hand)
            saberGroup.position.set(0, 0.5, 1.5); 
            scene.add(saberGroup);
            saber = saberGroup; // Assign to global variable for rotation updates

            // Grid helper for floor context
            const gridHelper = new THREE.GridHelper(20, 20, 0x00ffff, 0x444444);
            scene.add(gridHelper);

            // Animation Loop
            function animate() {
                requestAnimationFrame(animate);
                renderer.render(scene, camera);
            }
            animate();

            // Handle window resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
