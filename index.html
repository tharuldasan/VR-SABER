<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Saber Bridge - PIN Edition</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #111; 
            color: #00ffff; font-family: 'Courier New', Courier, monospace; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
        }
        #ui-container {
            background: rgba(0, 20, 20, 0.8); padding: 20px; border: 1px solid #00ffff; border-radius: 10px;
            text-align: center; z-index: 10; max-width: 400px; width: 90%;
        }
        button {
            background: rgba(0, 255, 255, 0.1); color: #00ffff; border: 1px solid #00ffff;
            padding: 12px 24px; margin: 10px; cursor: pointer; font-size: 16px; font-weight: bold;
            text-transform: uppercase; transition: 0.2s;
        }
        button:hover { background: #00ffff; color: #000; }
        input {
            background: #000; color: #00ffff; border: 1px solid #00ffff;
            padding: 15px; margin: 10px 0; width: 60%; text-align: center; font-size: 24px; font-weight: bold;
            letter-spacing: 5px;
        }
        /* Hide arrows on number input */
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
        #debug-overlay { 
            position: absolute; top: 10px; left: 10px; color: #00ff00; 
            font-size: 14px; z-index: 20; pointer-events: none; display: none;
            background: rgba(0,0,0,0.5); padding: 10px;
        }
        .hidden { display: none !important; }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <h1>SABER BRIDGE</h1>
        <div id="step-1">
            <p>Select your device role:</p>
            <button onclick="startPCMode()">I am the Screen (PC)</button><br>
            <button onclick="startPhoneMode()">I am the Saber (Phone)</button>
        </div>

        <div id="pc-ui" class="hidden">
            <p>Waiting for phone connection...</p>
            <p>Enter this PIN on your phone:</p>
            <h1 id="pc-id" style="color: #fff; background: #222; padding: 20px; font-size: 48px; margin: 10px 0;">----</h1>
        </div>

        <div id="phone-ui" class="hidden">
            <p>Enter the 4-digit PIN from your PC:</p>
            <input type="number" id="target-id" placeholder="1234" maxlength="4">
            <button id="connect-btn" onclick="connectToPC()">Connect</button>
            <p id="phone-status" style="font-size: 14px; color: #ffeb3b; margin-top: 20px; white-space: pre-wrap;"></p>
        </div>
    </div>

    <div id="game-container"></div>
    <div id="debug-overlay">Waiting for motion data...</div>

    <script>
        let peer;
        let conn;
        const PREFIX = "vrsaber-"; // Used to prevent collisions on the public PeerJS server

        // --- 1. PC (SCREEN) LOGIC ---
        function startPCMode() {
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('pc-ui').classList.remove('hidden');
            
            // Generate a random 4-digit PIN
            const pin = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('pc-id').innerText = pin;
            
            // Initialize PeerJS with the prefixed PIN
            peer = new Peer(PREFIX + pin); 

            peer.on('connection', function(connection) {
                conn = connection;
                
                // Hide UI and show Game & Debug
                document.getElementById('ui-container').classList.add('hidden');
                document.getElementById('game-container').style.display = 'block';
                const debugScreen = document.getElementById('debug-overlay');
                debugScreen.style.display = 'block';
                
                init3DScene();

                // Listen for data from phone
                conn.on('data', function(data) {
                    if(data.type === 'rotation' && saber) {
                        // Apply rotation
                        saber.rotation.x = THREE.MathUtils.degToRad(data.beta); // Pitch
                        saber.rotation.z = THREE.MathUtils.degToRad(-data.gamma); // Roll
                        saber.rotation.y = THREE.MathUtils.degToRad(data.alpha); // Yaw
                        
                        // Update PC Debug Text so you know data is arriving
                        debugScreen.innerText = `Receiving Data from Phone...\nPitch (Beta): ${Math.round(data.beta)}°\nYaw (Alpha): ${Math.round(data.alpha)}°\nRoll (Gamma): ${Math.round(data.gamma)}°`;
                    }
                });
            });
        }

        // --- 2. PHONE (SABER) LOGIC ---
        function startPhoneMode() {
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('phone-ui').classList.remove('hidden');
            peer = new Peer();
        }

        function connectToPC() {
            const enteredPin = document.getElementById('target-id').value.trim();
            if (enteredPin.length !== 4) {
                alert("Please enter a valid 4-digit PIN.");
                return;
            }

            const statusText = document.getElementById('phone-status');
            statusText.innerText = "Connecting to PC...";
            
            // Connect using the prefixed PIN
            conn = peer.connect(PREFIX + enteredPin);

            conn.on('open', function() {
                document.getElementById('connect-btn').classList.add('hidden');
                document.getElementById('target-id').classList.add('hidden');
                
                // Ask for permission for motion sensors (Mandatory for iOS)
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    statusText.innerText = "Connection found.\nTap anywhere on the screen to allow Motion Sensors.";
                    
                    // iOS requires a physical click to grant permissions
                    document.body.addEventListener('click', function requestPerms() {
                        DeviceOrientationEvent.requestPermission()
                            .then(permissionState => {
                                if (permissionState === 'granted') {
                                    startSendingMotionData(statusText);
                                    document.body.removeEventListener('click', requestPerms);
                                } else {
                                    statusText.innerText = "Motion permission denied. Cannot play.";
                                }
                            })
                            .catch(console.error);
                    }, { once: true });
                } else {
                    // Android & non-iOS devices usually don't need a permission prompt
                    startSendingMotionData(statusText);
                }
            });

            conn.on('error', function(err) {
                statusText.innerText = "Connection Error. Wrong PIN?";
            });
        }

        function startSendingMotionData(statusText) {
            window.addEventListener('deviceorientation', (event) => {
                // If alpha/beta/gamma are null, the phone is blocking sensors (usually due to lack of HTTPS)
                if (event.alpha === null || event.beta === null || event.gamma === null) {
                    statusText.innerText = "ERROR: Sensors are blocked.\nMake sure you are using HTTPS (secure connection).";
                    return;
                }

                if (conn && conn.open) {
                    conn.send({
                        type: 'rotation',
                        alpha: event.alpha || 0,
                        beta: event.beta || 0,
                        gamma: event.gamma || 0
                    });
                    // Update Phone Debug Text so you know it's working
                    statusText.innerText = `Connected!\n\nSending Motion:\nPitch: ${Math.round(event.beta)}°\nRoll: ${Math.round(event.gamma)}°`;
                }
            });
        }

        // --- 3. 3D SCENE LOGIC (PC ONLY) ---
        let scene, camera, renderer, saber;

        function init3DScene() {
            const container = document.getElementById('game-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.5, 4);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const light = new THREE.AmbientLight(0x404040); 
            scene.add(light);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(0, 1, 1);
            scene.add(directionalLight);

            // Group acts as the pivot point
            const saberGroup = new THREE.Group();
            
            const handleGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.5, 16);
            const handleMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.position.y = 0.25; 
            
            const bladeGeo = new THREE.CylinderGeometry(0.05, 0.05, 2.5, 16);
            const bladeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const blade = new THREE.Mesh(bladeGeo, bladeMat);
            blade.position.y = 1.75; 

            saberGroup.add(handle);
            saberGroup.add(blade);

            saberGroup.position.set(0, 0.5, 1.5); 
            scene.add(saberGroup);
            saber = saberGroup; 

            const gridHelper = new THREE.GridHelper(20, 20, 0x00ffff, 0x444444);
            scene.add(gridHelper);

            function animate() {
                requestAnimationFrame(animate);
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
